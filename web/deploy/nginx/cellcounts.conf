# nginx for Cell Counts — mounted over /etc/nginx/conf.d/default.conf, so
# everything here sits inside the stock nginx.conf's http {} block.
#
# Request path: browser → Cloudflare → tunnel → cloudflared → this → web:8000.
# Nothing publishes a port on the host; cloudflared (on the `edge` network) is
# the only client this server ever sees.

server_tokens off;

# The real client address is in CF-Connecting-IP, set by Cloudflare. Trust it
# only from the edge network (where cloudflared lives) — keep this subnet in
# sync with networks.edge in docker-compose.yml.
real_ip_header CF-Connecting-IP;
set_real_ip_from 172.29.0.0/24;

# Every real request arrives through the tunnel with CF-Connecting-IP set.
# Anything without it didn't come from Cloudflare and is refused.
map $http_cf_connecting_ip $not_via_cloudflare {
    ""      1;
    default 0;
}

log_format cellcounts '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      '$request_time "$http_user_agent" cf-ray=$http_cf_ray';

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml;

# Docker's DNS. `resolve` keeps looking `web` up, so a deploy that gives the
# web container a new address doesn't leave nginx sending to the old one.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream django {
    zone django 64k;
    server web:8000 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    access_log /dev/stdout cellcounts;

    if ($not_via_cloudflare) {
        return 403;
    }

    # Default request body cap: JSON and form posts. Upload routes raise it below.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # TLS ended at Cloudflare; every request reaching us was HTTPS at the edge.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Collected static files, published by the `migrate` release step. Names are
    # content-hashed (ManifestStaticFilesStorage / Vite), so cache them forever.
    location /static/ {
        alias /srv/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Upload chunks (32 MB) and the desktop-import `complete` body. Stream them
    # to Django as they arrive instead of spooling each one to nginx's disk first.
    location /api/uploads/ {
        client_max_body_size 64m;
        client_body_buffer_size 1m;
        proxy_request_buffering off;
        proxy_pass http://django;
    }

    # Files Django has already authorized, handed back with X-Accel-Redirect
    # (projects/api.py tile view, exports download). Never reachable directly.
    location /_protected/tiles/ {
        internal;
        alias /data/tiles/;
    }
    location /_protected/exports/ {
        internal;
        alias /data/exports/;
    }

    location /internal/ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    location / {
        proxy_pass http://django;
    }
}

# Container healthcheck only; not reachable from the tunnel (cloudflared is
# pointed at port 80).
server {
    listen 8081;
    access_log off;
    location = /nginx-health {
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}
